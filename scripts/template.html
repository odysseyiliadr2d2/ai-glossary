<title>실무 AI 용어집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="비개발자와 개발자를 함께 위한 실무 AI 용어 위키. 분야·주제별 트리, 입문·심화 설명, 날짜별 변경 타임라인.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: AX newsletter language — navy masthead band with amber rule, light gray page, white cards; wiki rail (menu card + tree card) left, one card stack per document right */
:root {
  --page: #eef1f5;
  --card: #ffffff;
  --ink: #1f2933;
  --body: #4a5563;
  --muted: #8a94a3;
  --line: #e1e6ee;
  --line-soft: #eef1f5;
  --navy: #14213d;
  --navy-2: #1d2d52;
  --navy-sub: #c9d4e8;
  --navy-dim: #8fa3c7;
  --amber: #fca311;
  --amber-deep: #d97706;
  --link: #1a56db;
  --tint-easy: #ecf8f0; --tint-easy-fg: #046c4e;
  --tint-deep: #fdf0f3; --tint-deep-fg: #9f1239;
  --tint-ex: #fff8e6;   --tint-ex-fg: #7a5200;
  --l1-bg: #def7ec; --l1: #046c4e;
  --l2-bg: #fdf6b2; --l2: #8e4b10;
  --l3-bg: #fde8e8; --l3: #c81e1e;
  /* 분야 색 (배경/글자) */
  --c-basics-bg: #e8f0fe; --c-basics: #1a56db;
  --c-dl-bg: #f3e8ff; --c-dl: #6b21a8;
  --c-llm-bg: #e0f2f1; --c-llm: #00695c;
  --c-training-bg: #fdf6b2; --c-training: #8e4b10;
  --c-prompt-bg: #fde8e8; --c-prompt: #c81e1e;
  --c-rag-bg: #def7ec; --c-rag: #046c4e;
  --c-agent-bg: #e0e7ff; --c-agent: #3730a3;
  --c-genai-bg: #fce7f3; --c-genai: #9d174d;
  --c-infra-bg: #e5e7eb; --c-infra: #374151;
  --c-safety-bg: #fff1f2; --c-safety: #9f1239;
  --c-biz-bg: #fff8e6; --c-biz: #7a5200;
  --f-sans: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0c1220; --card: #151d2e; --ink: #e6ebf3; --body: #b6c0cf; --muted: #7d889a; --line: #26324a; --line-soft: #1c263a;
    --navy: #0a1430; --navy-2: #13203f; --navy-sub: #b7c4dc; --navy-dim: #7f93b8; --amber: #fca311; --amber-deep: #fbbf24; --link: #7fa7ff;
    --tint-easy: #10291f; --tint-easy-fg: #6ee7b7; --tint-deep: #2d1520; --tint-deep-fg: #fda4af; --tint-ex: #2a2110; --tint-ex-fg: #fcd34d;
    --l1-bg: #10291f; --l1: #6ee7b7; --l2-bg: #2f2710; --l2: #fcd34d; --l3-bg: #33161a; --l3: #fca5a5;
    --c-basics-bg: #172a4d; --c-basics: #93b4ff; --c-dl-bg: #2a1a40; --c-dl: #d8b4fe; --c-llm-bg: #0f2c2a; --c-llm: #5eead4;
    --c-training-bg: #2f2710; --c-training: #fcd34d; --c-prompt-bg: #33161a; --c-prompt: #fca5a5; --c-rag-bg: #10291f; --c-rag: #6ee7b7;
    --c-agent-bg: #1e1f4a; --c-agent: #a5b4fc; --c-genai-bg: #36142a; --c-genai: #f9a8d4; --c-infra-bg: #222a38; --c-infra: #cbd5e1;
    --c-safety-bg: #33161a; --c-safety: #fda4af; --c-biz-bg: #2a2110; --c-biz: #fcd34d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0c1220; --card: #151d2e; --ink: #e6ebf3; --body: #b6c0cf; --muted: #7d889a; --line: #26324a; --line-soft: #1c263a;
  --navy: #0a1430; --navy-2: #13203f; --navy-sub: #b7c4dc; --navy-dim: #7f93b8; --amber: #fca311; --amber-deep: #fbbf24; --link: #7fa7ff;
  --tint-easy: #10291f; --tint-easy-fg: #6ee7b7; --tint-deep: #2d1520; --tint-deep-fg: #fda4af; --tint-ex: #2a2110; --tint-ex-fg: #fcd34d;
  --l1-bg: #10291f; --l1: #6ee7b7; --l2-bg: #2f2710; --l2: #fcd34d; --l3-bg: #33161a; --l3: #fca5a5;
  --c-basics-bg: #172a4d; --c-basics: #93b4ff; --c-dl-bg: #2a1a40; --c-dl: #d8b4fe; --c-llm-bg: #0f2c2a; --c-llm: #5eead4;
  --c-training-bg: #2f2710; --c-training: #fcd34d; --c-prompt-bg: #33161a; --c-prompt: #fca5a5; --c-rag-bg: #10291f; --c-rag: #6ee7b7;
  --c-agent-bg: #1e1f4a; --c-agent: #a5b4fc; --c-genai-bg: #36142a; --c-genai: #f9a8d4; --c-infra-bg: #222a38; --c-infra: #cbd5e1;
  --c-safety-bg: #33161a; --c-safety: #fda4af; --c-biz-bg: #2a2110; --c-biz: #fcd34d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-sans); font-size: 15px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
a { color: var(--link); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- masthead ---------- */
.mast { background: var(--navy); }
.mast-in { max-width: 1240px; margin: 0 auto; padding-block: 26px 22px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 420px); gap: 16px 32px; align-items: end; }
.eyebrow { font-size: 12px; letter-spacing: 2px; color: var(--navy-dim); font-weight: 600; }
.mast h1 { margin: 6px 0 0; font-size: 30px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.mast h1 a { color: #fff; text-decoration: none; }
.mast .sub { color: var(--navy-sub); font-size: 14px; margin-top: 6px; }
.mast-tools { display: grid; gap: 10px; }
.search { position: relative; }
.search input { width: 100%; padding: 12px 40px 12px 16px; border: 0; border-radius: 10px; background: #fff; color: #1f2933; font-size: 15px; }
.search input::placeholder { color: #8a94a3; }
.search input:focus { outline: 3px solid var(--amber); outline-offset: 0; }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: 11px; color: #8a94a3; border: 1px solid #e1e6ee; border-radius: 4px; padding: 0 5px; }
.search input:not(:placeholder-shown) + kbd { display: none; }
@media (hover: none) { .search kbd { display: none; } }
.mast-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.dl { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: var(--amber); color: #14213d; text-decoration: none; font-size: 13px; font-weight: 700; }
.dl:hover { filter: brightness(1.06); }
.dl span { font-family: var(--f-mono); font-size: 11px; font-weight: 500; opacity: .75; }
.mast .upd { font-size: 12px; color: var(--navy-dim); }
.stripe { height: 4px; background: var(--amber); }

/* ---------- layout ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 22px 64px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; min-width: 0; }
.card.tight { padding: 14px 16px; }
.card.edge-amber { border-left: 4px solid var(--amber); }
.card.edge-teal { border-left: 4px solid #0e7490; }
.card.edge-green { border-left: 4px solid var(--l1); }
.card.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
.label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin: 0 0 10px; }
.h-sec { font-size: 15px; font-weight: 700; color: var(--ink); margin: 6px 4px 0; display: flex; align-items: baseline; gap: 8px; }
.h-sec small { font-size: 12.5px; color: var(--muted); font-weight: 400; }

/* ---------- rail ---------- */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start; max-height: calc(100vh - 24px); overflow-y: auto; display: grid; gap: 14px; scrollbar-width: thin; padding-bottom: 8px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px; }
.nav a:hover { background: var(--line-soft); }
.nav a[aria-current="page"] { background: var(--navy); color: #fff; }
.nav a small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.nav a[aria-current="page"] small { color: var(--navy-dim); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--line-soft); border-radius: 999px; padding: 3px; }
.seg button { background: none; border: 0; padding: 5px 4px; font-size: 13px; cursor: pointer; border-radius: 999px; color: var(--body); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(20,33,61,.12); }
.tree-box > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.tree-box > summary::-webkit-details-marker { display: none; }
.tree-box > summary .label { margin: 0; }
.tree-box > summary::after { content: "▾"; color: var(--muted); font-size: 12px; }
.tree-box:not([open]) > summary::after { content: "▸"; }
.tree { font-size: 14px; margin-top: 10px; }
.tree summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: "▸"; font-size: 10px; color: var(--muted); width: 10px; flex: none; transition: transform .15s; }
.tree details[open] > summary::before { transform: rotate(90deg); }
.tree summary:hover { background: var(--line-soft); }
.tree summary a { color: var(--ink); text-decoration: none; flex: 1; min-width: 0; }
.tree summary small { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.tree .cat > summary a { font-weight: 600; }
.tree .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tree .topic { margin-left: 14px; }
.tree .pages { margin: 0 0 4px 30px; padding: 0; list-style: none; border-left: 2px solid var(--line-soft); }
.tree .pages a { display: block; padding: 1px 8px; font-size: 13px; color: var(--body); text-decoration: none; border-radius: 4px; }
.tree .pages a:hover { color: var(--ink); background: var(--line-soft); }
.tree a.on { color: var(--link) !important; font-weight: 700; }
.rail-foot { font-size: 12px; color: var(--muted); line-height: 1.6; padding: 0 4px; }

/* ---------- pills ---------- */
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; line-height: 1.4; text-decoration: none; }
.pill.l1 { background: var(--l1-bg); color: var(--l1); }
.pill.l2 { background: var(--l2-bg); color: var(--l2); }
.pill.l3 { background: var(--l3-bg); color: var(--l3); }
.pill.added { background: var(--l1-bg); color: var(--l1); }
.pill.updated { background: var(--l2-bg); color: var(--l2); }
.pill.moved { background: var(--c-basics-bg); color: var(--c-basics); }
.pill.removed { background: var(--l3-bg); color: var(--l3); }
.pill.ghost { background: var(--line-soft); color: var(--body); font-weight: 600; }
.c-basics { --cb: var(--c-basics-bg); --cf: var(--c-basics); } .c-dl { --cb: var(--c-dl-bg); --cf: var(--c-dl); }
.c-llm { --cb: var(--c-llm-bg); --cf: var(--c-llm); } .c-training { --cb: var(--c-training-bg); --cf: var(--c-training); }
.c-prompt { --cb: var(--c-prompt-bg); --cf: var(--c-prompt); } .c-rag { --cb: var(--c-rag-bg); --cf: var(--c-rag); }
.c-agent { --cb: var(--c-agent-bg); --cf: var(--c-agent); } .c-genai { --cb: var(--c-genai-bg); --cf: var(--c-genai); }
.c-infra { --cb: var(--c-infra-bg); --cf: var(--c-infra); } .c-safety { --cb: var(--c-safety-bg); --cf: var(--c-safety); }
.c-biz { --cb: var(--c-biz-bg); --cf: var(--c-biz); }
.pill.cat { background: var(--cb); color: var(--cf); }
.tree .dot { background: var(--cf); }

/* ---------- page header card ---------- */
.crumbs { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0 0 8px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--link); text-decoration: underline; }
.crumbs span[aria-hidden] { opacity: .6; }
.page-title { font-size: 32px; font-weight: 700; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; color: var(--ink); }
.page-sub { font-family: var(--f-mono); font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.page-sub b { color: var(--ink); font-weight: 500; }
.lede { font-size: 15px; color: var(--body); max-width: 70ch; margin: 10px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 14px; font-size: 12.5px; color: var(--muted); }

/* ---------- grids of cards ---------- */
.grid { display: grid; gap: 14px; }
.grid.g2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.grid.g3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.g4 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
a.tcard { display: grid; align-content: start; gap: 6px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
a.tcard:hover { border-color: var(--amber); transform: translateY(-1px); }
.tcard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tcard .no { font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--muted); }
.tcard .t { font-size: 17px; font-weight: 700; line-height: 1.4; color: var(--ink); }
.tcard .e { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: -4px; }
.tcard p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--body); }
.tcard .go { font-size: 13px; color: var(--link); font-weight: 600; margin-top: 4px; }
mark { background: #fff1b8; color: #1f2933; border-radius: 2px; padding: 0 1px; }

/* stat tiles */
.stat .n { font-size: 30px; font-weight: 700; color: var(--navy); line-height: 1.1; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .stat .n { color: var(--amber); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat .n { color: var(--amber); } }
.stat .k { font-size: 12.5px; color: var(--muted); }

/* home */
.today .k { font-size: 12px; letter-spacing: 1.5px; color: var(--amber); font-weight: 700; }
.today h3 { font-size: 24px; margin: 8px 0 0; line-height: 1.3; }
.today h3 a { color: #fff; text-decoration: none; }
.today h3 a:hover { text-decoration: underline; }
.today .en { font-family: var(--f-mono); font-size: 12.5px; color: var(--navy-dim); }
.today p { margin: 10px 0 0; color: var(--navy-sub); line-height: 1.7; }
.today .go { display: inline-block; margin-top: 12px; color: var(--amber); font-weight: 700; text-decoration: none; font-size: 13.5px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 14px; align-items: baseline; }
.rows li:first-child { border-top: 0; padding-top: 0; }
.rows .d { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.catcard h3 { margin: 10px 0 0; font-size: 17px; }
.catcard h3 a { color: var(--ink); text-decoration: none; }
.catcard h3 a:hover { color: var(--link); }
.catcard .cnt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.catcard ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.catcard ul a { display: inline-block; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--line-soft); color: var(--body); text-decoration: none; }
.catcard ul a:hover { background: var(--cb); color: var(--cf); }
.catcard { border-top: 4px solid var(--cf); }

/* topic / category */
.chipline { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.chip:hover { border-color: var(--amber); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip[aria-pressed="true"] .n { color: var(--navy-dim); }
.chip.pop b { font-family: var(--f-mono); font-size: 11px; color: var(--amber-deep); font-weight: 700; }
.topiccard h3 { margin: 0; font-size: 18px; }
.topiccard h3 a { color: var(--ink); text-decoration: none; }
.topiccard h3 a:hover { color: var(--link); }
.topiccard .td { color: var(--body); font-size: 13.5px; margin: 6px 0 12px; }

/* term document */
.doc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.defs { display: grid; gap: 12px; }
.def { border-radius: 10px; padding: 14px 16px; }
.def .tag { font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; }
.def p { margin: 0; font-size: 15.5px; line-height: 1.75; color: var(--ink); }
.def.easy { background: var(--tint-easy); } .def.easy .tag { color: var(--tint-easy-fg); }
.def.deep { background: var(--tint-deep); } .def.deep .tag { color: var(--tint-deep-fg); }
.def.ex { background: var(--tint-ex); } .def.ex .tag { color: var(--tint-ex-fg); }
.def.ex p { font-size: 14.5px; }
.side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.side li a, .side li span, .side li strong { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--line-soft); color: var(--ink); text-decoration: none; }
.side li a:hover { background: var(--c-basics-bg); color: var(--link); }
.side li strong { background: var(--navy); color: #fff; }
.side .none { color: var(--muted); font-size: 13px; margin: 0; }
.more-links summary { cursor: pointer; color: var(--link); font-size: 13px; margin-top: 8px; }
.more-links ul { margin-top: 8px; }
.seq { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.seq a { text-decoration: none; color: var(--ink); font-weight: 600; display: grid; gap: 2px; }
.seq a small { color: var(--muted); font-size: 12px; font-weight: 400; }
.seq a.next { text-align: right; grid-column: 2; }
.seq a:hover { border-color: var(--amber); }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 92px auto minmax(0,1fr); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
.hist li:first-child { border-top: 0; padding-top: 0; }
.hist .d { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.gone { color: var(--muted); text-decoration: line-through; }

/* timeline */
.tl-next { font-size: 13px; color: var(--muted); margin-top: 8px; }
.timeline { position: relative; list-style: none; margin: 0; padding: 0 0 0 28px; display: grid; gap: 16px; }
.timeline::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.tl-day { position: relative; }
.tl-day::before { content: ""; position: absolute; left: -26px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); border: 3px solid var(--page); }
.tl-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.tl-date { font-family: var(--f-mono); font-size: 14px; font-weight: 500; color: var(--amber-deep); }
.tl-date small { color: var(--muted); margin-left: 6px; font-family: var(--f-sans); }
.tl-title { font-size: 20px; font-weight: 700; margin: 4px 0 0; }
.tl-note { color: var(--body); margin: 6px 0 0; max-width: 70ch; font-size: 14px; }
.tl-counts { display: flex; gap: 6px; flex-wrap: wrap; }
.tl-group { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.tl-group h5 { font-size: 12.5px; font-weight: 700; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.tl-items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.tl-items li a, .tl-items li span.gone { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--line-soft); color: var(--ink); text-decoration: none; }
.tl-items li a:hover { background: var(--c-basics-bg); color: var(--link); }
.tl-items li i { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 4px; }
.more { margin-top: 14px; background: var(--line-soft); border: 0; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--link); }

/* index */
.ix { columns: 3 240px; column-gap: 14px; }
.ix-group { break-inside: avoid; margin-bottom: 14px; display: block; }
.ix-group h2 { font-size: 22px; font-weight: 700; line-height: 1; color: var(--amber-deep); margin: 0 0 8px; }
.ix-group a { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line-soft); text-decoration: none; color: var(--ink); font-size: 14px; line-height: 1.5; }
.ix-group a:hover .k { color: var(--link); text-decoration: underline; }
.ix-group .e { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48%; }
.toolrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 14px; }
.toolrow label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.toolrow select { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px 8px; font-size: 13px; }

/* ranking */
.rank { list-style: none; padding: 0; margin: 0; }
.rank li { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(80px, 180px); gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.rank li:first-child { border-top: 0; padding-top: 0; }
.rank .no { font-size: 20px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.rank li:nth-child(-n+3) .no { color: var(--amber-deep); font-size: 26px; }
.rank .t a { font-weight: 700; font-size: 16px; color: var(--ink); text-decoration: none; }
.rank .t a:hover { color: var(--link); }
.rank .t small { display: block; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.rank .v { display: grid; gap: 4px; }
.rank .bar { height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--amber); border-radius: 4px; }
.rank .hits { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.rank-note { color: var(--body); font-size: 13.5px; margin: 8px 0 0; }

.empty { color: var(--muted); }
.empty strong { display: block; font-size: 18px; color: var(--ink); margin-bottom: 6px; }
.toTop { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; cursor: pointer; font-size: 18px; box-shadow: 0 4px 12px rgba(20,33,61,.25); }

@media (max-width: 1060px) { .doc-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .mast-in { grid-template-columns: minmax(0, 1fr); padding-block: 20px 16px; }
  .mast h1 { font-size: 25px; }
  .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 14px 48px; gap: 14px; }
  .rail { position: static; max-height: none; overflow: visible; }
  .nav { grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .nav a { justify-content: center; background: var(--line-soft); padding: 7px 4px; font-size: 13px; }
  .nav a small { display: none; }
  .card { padding: 16px; }
  .page-title { font-size: 26px; }
  .ix { columns: 2 150px; }
  .rank li { grid-template-columns: 30px minmax(0, 1fr) 70px; gap: 10px; }
  .hist li { grid-template-columns: 84px minmax(0, 1fr); }
  .hist li .pill { display: none; }
  .seq { grid-template-columns: minmax(0, 1fr); }
  .seq a.next { grid-column: 1; }
  .m-hide { display: none !important; }
}
:root[data-theme="dark"] .nav a[aria-current="page"] { background: var(--amber); color: #14213d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav a[aria-current="page"] { background: var(--amber); color: #14213d; } }
@media (prefers-reduced-motion: reduce) { .tree summary::before, a.tcard { transition: none; } }

<script>
const TERMS = /*__DATA__*/[];
const TREE = /*__TREE__*/[];
const CHANGES = /*__CHANGES__*/[];
const RELEASES = /*__RELEASES__*/[];
/* 조회 순위 집계 설정 — Supabase 프로젝트 URL과 publishable 키. 비워 두면 순위 기능은 숨겨진다. */
const STATS = { url: "", key: "" };

const LEVELS = { 1: "입문", 2: "실무", 3: "심화" };
const TYPES = { added: "추가", updated: "수정", moved: "이동", removed: "삭제" };
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const CHO_BASE = { "ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ" };
const KO_INDEX = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const koCmp = new Intl.Collator("ko");

/* ---------- 인덱스 구성 ---------- */
const LIVE = TERMS.filter(t => t.status !== "removed");
const byId = new Map(TERMS.map(t => [t.id, t]));
const catById = new Map(TREE.map(c => [c.id, c]));
const topicById = new Map();
TREE.forEach(c => c.topics.forEach((tp, i) => topicById.set(tp.id, Object.assign(tp, { cat: c.id, idx: i }))));
const backlinks = new Map();
LIVE.forEach(t => (t.related || []).forEach(r => { if (!backlinks.has(r)) backlinks.set(r, []); backlinks.get(r).push(t.id); }));
const histOf = new Map();
CHANGES.forEach(c => { if (!histOf.has(c.id)) histOf.set(c.id, []); histOf.get(c.id).push(c); });
const liveTopicTerms = tp => tp.terms.filter(id => byId.has(id) && byId.get(id).status !== "removed");

function choOf(s) {
  const c = s.trim().charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) { const ch = CHO[Math.floor((c - 0xAC00) / 588)]; return CHO_BASE[ch] || ch; }
  const L = s.trim()[0].toUpperCase();
  return /[A-Z]/.test(L) ? L : "#";
}
function initials(s) { let o = ""; for (const ch of s) { const c = ch.charCodeAt(0); o += (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c - 0xAC00) / 588)] : ch.toLowerCase(); } return o; }
LIVE.forEach(t => {
  t._hay = [t.ko, t.en, t.abbr, t.easy, t.deep, t.example].join(" ").toLowerCase();
  t._name = [t.ko, t.en, t.abbr].join(" ").toLowerCase();
  t._ini = initials(t.ko.replace(/\s/g, ""));
});

const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const state = { route: "home", q: "", view: store.get("gl-view") || "both", levels: new Set(), ixSort: store.get("gl-ixsort") || "ko", tlType: "all" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtDate = d => d.replaceAll("-", ".");
function hi(text, q) {
  const e = esc(text); if (!q) return e;
  const qq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return e.replace(new RegExp(qq, "gi"), m => `<mark>${m}</mark>`);
}
const lvBadge = l => `<span class="pill l${l}">${LEVELS[l]}</span>`;
const catPill = (catId, label) => `<span class="pill cat c-${catId}">${esc(label ?? catById.get(catId)?.ko ?? "")}</span>`;
const termLink = (id, cls = "") => { const t = byId.get(id); if (!t) return ""; return t.status === "removed" ? `<span class="gone">${esc(t.ko)}</span>` : `<a href="#${id}" data-go="${id}" class="${cls}">${esc(t.ko)}</a>`; };
const sep = `<span aria-hidden="true">›</span>`;
const crumbs = (...parts) => `<nav class="crumbs"><a href="#home" data-go="home">대문</a>${parts.map(p => sep + p).join("")}</nav>`;
const enOf = t => t.abbr && t.abbr !== t.en ? `${t.abbr} · ${t.en}` : t.en;
function termCard(t, opts = {}) {
  const tp = topicById.get(t.topic);
  const text = opts.text ?? (state.view === "deep" ? t.deep : t.easy);
  return `<a class="card tcard" href="#${t.id}" data-go="${t.id}">
    <div class="top">${opts.no ? `<span class="no">${String(opts.no).padStart(2, "0")}</span>` : catPill(tp.cat, opts.topicLabel ? tp.ko : undefined)}${lvBadge(t.level)}</div>
    <div class="t">${opts.hq !== undefined ? hi(t.ko, opts.hq) : esc(t.ko)}</div>
    <div class="e">${opts.hq !== undefined ? hi(enOf(t), opts.hq) : esc(enOf(t))}</div>
    <p>${opts.hq !== undefined ? hi(text, opts.hq) : esc(text)}</p>
  </a>`;
}

/* ---------- 트리 ---------- */
function buildTree() {
  $("#tree").innerHTML = TREE.map(c => {
    const n = c.topics.reduce((s, tp) => s + liveTopicTerms(tp).length, 0);
    return `<details class="cat c-${c.id}" data-cat="${c.id}"><summary><i class="dot"></i><a href="#c-${c.id}" data-go="c-${c.id}">${esc(c.ko)}</a><small>${n}</small></summary>
      ${c.topics.map(tp => `<details class="topic" data-topic="${tp.id}"><summary><a href="#t-${tp.id}" data-go="t-${tp.id}">${esc(tp.ko)}</a><small>${liveTopicTerms(tp).length}</small></summary>
        <ul class="pages">${liveTopicTerms(tp).map(id => `<li><a href="#${id}" data-go="${id}" data-page="${id}">${esc(byId.get(id).ko)}</a></li>`).join("")}</ul></details>`).join("")}
    </details>`;
  }).join("");
}
function syncTree(catId, topicId, pageId) {
  document.querySelectorAll("#tree a.on").forEach(a => a.classList.remove("on"));
  if (catId) { const d = document.querySelector(`#tree details[data-cat="${catId}"]`); if (d) { d.open = true; d.querySelector(":scope > summary a").classList.add("on"); } }
  if (topicId) { const d = document.querySelector(`#tree details[data-topic="${topicId}"]`); if (d) { d.open = true; d.querySelector(":scope > summary a").classList.add("on"); } }
  if (pageId) { const a = document.querySelector(`#tree a[data-page="${pageId}"]`); if (a) { a.classList.add("on"); if (matchMedia("(min-width: 861px)").matches) a.scrollIntoView({ block: "nearest" }); } }
}

/* ---------- 화면: 대문 ---------- */
function todayTerm() {
  const d = new Date(); const seed = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
  const pool = LIVE.filter(t => t.level <= 2);
  return pool[(seed * 2654435761 >>> 0) % pool.length];
}
function typeSummary(list) {
  const n = {}; list.forEach(c => n[c.type] = (n[c.type] || 0) + 1);
  return Object.keys(TYPES).filter(k => n[k]).map(k => `<span class="pill ${k}">${TYPES[k]} ${n[k]}</span>`).join(" ");
}
const releaseOf = d => RELEASES.find(r => r.date === d);
function viewHome() {
  syncTree();
  const t = todayTerm(), ttp = topicById.get(t.topic);
  const days = [...new Set(CHANGES.map(c => c.date))].sort().reverse();
  const recentRows = days.slice(0, 5).map(d => {
    const list = CHANGES.filter(c => c.date === d);
    const body = list.length > 6
      ? `${esc(releaseOf(d)?.title || "변경")} ${typeSummary(list)}`
      : list.map(c => `${termLink(c.id)} <span class="pill ${c.type}">${TYPES[c.type]}</span>`).join(" · ");
    return `<li><span class="d">${fmtDate(d)}</span><span>${body}</span></li>`;
  }).join("");
  const topics = TREE.reduce((s, c) => s + c.topics.length, 0);
  return `
    <section class="grid g4">
      <div class="card stat"><div class="n">${LIVE.length}</div><div class="k">문서</div></div>
      <div class="card stat"><div class="n">${TREE.length}</div><div class="k">분야</div></div>
      <div class="card stat"><div class="n">${topics}</div><div class="k">주제</div></div>
      <div class="card stat"><div class="n">${fmtDate(days[0] || "").slice(5)}</div><div class="k">마지막 갱신 · 다음 ${fmtDate(nextUpdate()).slice(5)}</div></div>
    </section>
    <section class="grid g2">
      <div class="card navy today"><div class="k">오늘의 용어</div>
        <h3><a href="#${t.id}" data-go="${t.id}">${esc(t.ko)}</a></h3>
        <div class="en">${esc(enOf(t))} · ${esc(catById.get(ttp.cat).ko)} › ${esc(ttp.ko)}</div>
        <p>${esc(t.easy)}</p>
        <a class="go" href="#${t.id}" data-go="${t.id}">문서 읽기 →</a></div>
      <div class="card edge-teal"><p class="label">최근 바뀜</p>
        <ul class="rows">${recentRows || '<li><span class="d"></span><span>아직 변경 기록이 없다.</span></li>'}</ul>
        <div style="margin-top:12px;font-size:13px"><a href="#timeline" data-go="timeline" style="font-weight:600;text-decoration:none">타임라인 전체 보기 →</a></div></div>
    </section>
    <h2 class="h-sec">분야별 둘러보기 <small>${TREE.length}개 분야 · ${topics}개 주제</small></h2>
    <section class="grid g3">${TREE.map(c => `<div class="card catcard c-${c.id}">
      ${catPill(c.id, c.en)}
      <h3><a href="#c-${c.id}" data-go="c-${c.id}">${esc(c.ko)}</a> <span class="cnt">${c.topics.reduce((s, tp) => s + liveTopicTerms(tp).length, 0)}</span></h3>
      <ul>${c.topics.map(tp => `<li><a href="#t-${tp.id}" data-go="t-${tp.id}">${esc(tp.ko)}</a></li>`).join("")}</ul></div>`).join("")}</section>`;
}

/* ---------- 화면: 분야 ---------- */
function viewCategory(c) {
  syncTree(c.id);
  const n = c.topics.reduce((s, tp) => s + liveTopicTerms(tp).length, 0);
  return `<section class="card c-${c.id}" style="border-top:4px solid var(--cf)">${crumbs("<span>분야</span>")}
      ${catPill(c.id, c.en)}
      <h2 class="page-title" style="margin-top:8px">${esc(c.ko)}</h2><div class="page-sub">주제 ${c.topics.length}개 · 문서 ${n}개</div>
      <p class="lede">${esc(c.desc)}</p></section>
    <section class="grid g2">${c.topics.map((tp, i) => `<div class="card topiccard">
      <div class="tcard"><div class="top"><span class="no">주제 ${String(i + 1).padStart(2, "0")}</span><span class="pill ghost">${liveTopicTerms(tp).length}개 문서</span></div></div>
      <h3 style="margin-top:6px"><a href="#t-${tp.id}" data-go="t-${tp.id}">${esc(tp.ko)}</a></h3>
      <p class="td">${esc(tp.desc)}</p>
      <div class="chipline">${liveTopicTerms(tp).map(id => { const t = byId.get(id); return `<a class="chip" href="#${id}" data-go="${id}">${esc(t.ko)} <span class="n">${LEVELS[t.level]}</span></a>`; }).join("")}</div></div>`).join("")}</section>`;
}

/* ---------- 화면: 주제 ---------- */
function viewTopic(tp) {
  const c = catById.get(tp.cat);
  syncTree(c.id, tp.id);
  const ids = liveTopicTerms(tp);
  const prev = c.topics[tp.idx - 1], next = c.topics[tp.idx + 1];
  return `<section class="card c-${c.id}" style="border-top:4px solid var(--cf)">${crumbs(`<a href="#c-${c.id}" data-go="c-${c.id}">${esc(c.ko)}</a>`, "<span>주제</span>")}
      ${catPill(c.id)}
      <h2 class="page-title" style="margin-top:8px">${esc(tp.ko)}</h2><div class="page-sub">${esc(tp.en)} · 문서 ${ids.length}개</div>
      <p class="lede">${esc(tp.desc)}</p></section>
    <h2 class="h-sec">읽는 순서 <small>입문에서 심화로, 앞 개념을 알아야 이해되는 순서다</small></h2>
    <section class="grid g2">${ids.map((id, i) => termCard(byId.get(id), { no: i + 1 })).join("")}</section>
    <nav class="seq">${prev ? `<a class="card tight" href="#t-${prev.id}" data-go="t-${prev.id}"><small>← 이전 주제</small>${esc(prev.ko)}</a>` : ""}${next ? `<a class="card tight next" href="#t-${next.id}" data-go="t-${next.id}"><small>다음 주제 →</small>${esc(next.ko)}</a>` : ""}</nav>`;
}

/* ---------- 화면: 문서 ---------- */
function viewTerm(t) {
  const tp = topicById.get(t.topic), c = catById.get(tp.cat);
  syncTree(c.id, tp.id, t.id);
  track(t.id);
  const ids = liveTopicTerms(tp), i = ids.indexOf(t.id);
  const prev = ids[i - 1], next = ids[i + 1];
  const rel = (t.related || []).filter(id => byId.has(id) && id !== t.id);
  const back = (backlinks.get(t.id) || []).filter(id => id !== t.id && !rel.includes(id));
  const hist = (histOf.get(t.id) || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const showEasy = state.view !== "deep", showDeep = state.view !== "easy";
  const list = arr => `<ul>${arr.map(id => `<li>${termLink(id)}</li>`).join("")}</ul>`;
  return `<section class="card c-${c.id}" style="border-top:4px solid var(--cf)">
      ${crumbs(`<a href="#c-${c.id}" data-go="c-${c.id}">${esc(c.ko)}</a>`, `<a href="#t-${tp.id}" data-go="t-${tp.id}">${esc(tp.ko)}</a>`)}
      <h2 class="page-title">${esc(t.ko)}</h2>
      <div class="page-sub">${t.abbr && t.abbr !== t.en ? `<b>${esc(t.abbr)}</b> · ` : ""}${esc(t.en)}</div>
      <div class="meta">${lvBadge(t.level)}${catPill(c.id)}<a class="pill ghost" href="#t-${tp.id}" data-go="t-${tp.id}">${esc(tp.ko)}</a>
        <span>최초 수록 <span class="mono">${fmtDate(t.added)}</span></span><span>마지막 수정 <span class="mono">${fmtDate(t.updated)}</span></span><span>판 <span class="mono">${t.revision}</span></span></div>
    </section>
    <div class="doc-grid">
      <div class="stack">
        <section class="card"><div class="defs">
          ${showEasy ? `<div class="def easy"><span class="tag">입문 · 누구나</span><p>${esc(t.easy)}</p></div>` : ""}
          ${showDeep ? `<div class="def deep"><span class="tag">심화 · 구현자</span><p>${esc(t.deep)}</p></div>` : ""}
          ${t.example ? `<div class="def ex"><span class="tag">💡 실무 예시</span><p>${esc(t.example)}</p></div>` : ""}
        </div></section>
        <section class="card"><p class="label">문서 이력 · ${hist.length}건</p>
          <ul class="hist">${hist.map(h => `<li><span class="d">${fmtDate(h.date)}</span><span class="pill ${h.type}">${TYPES[h.type]}</span><span>${esc(h.summary)}</span></li>`).join("") || '<li><span class="none">기록 없음</span></li>'}</ul></section>
        <nav class="seq">${prev ? `<a class="card tight" href="#${prev}" data-go="${prev}"><small>← 이전 · ${esc(tp.ko)}</small>${esc(byId.get(prev).ko)}</a>` : ""}${next ? `<a class="card tight next" href="#${next}" data-go="${next}"><small>다음 · ${esc(tp.ko)} →</small>${esc(byId.get(next).ko)}</a>` : ""}</nav>
      </div>
      <aside class="stack side">
        <section class="card tight"><p class="label">연관 문서 · ${rel.length}</p>${rel.length ? list(rel) : '<p class="none">없음</p>'}</section>
        <section class="card tight"><p class="label">이 문서를 가리키는 문서 · ${back.length}</p>${back.length ? list(back.slice(0, 10)) + (back.length > 10 ? `<details class="more-links"><summary>나머지 ${back.length - 10}개 보기</summary>${list(back.slice(10))}</details>` : "") : '<p class="none">없음</p>'}</section>
        <section class="card tight"><p class="label">같은 주제 · ${esc(tp.ko)}</p><ul>${ids.map(id => `<li>${id === t.id ? `<strong>${esc(byId.get(id).ko)}</strong>` : termLink(id)}</li>`).join("")}</ul></section>
      </aside>
    </div>`;
}

/* ---------- 화면: 타임라인 ---------- */
function weekdayOf(d) { const [y, m, dd] = d.split("-").map(Number); return "일월화수목금토"[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]; }
function nextUpdate() {
  // 기준일 2026-10-19(월)부터 2주 간격의 월요일 (KST 오전 9시 전후 반영)
  const base = Date.UTC(2026, 9, 19), day = 86400000, now = Date.now() + 9 * 3600000;
  let n = base; while (n + 9 * 3600000 <= now) n += 14 * day;
  const d = new Date(n); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}
function viewTimeline() {
  syncTree();
  const days = [...new Set(CHANGES.map(c => c.date).concat(RELEASES.map(r => r.date)))].sort().reverse();
  const filt = state.tlType;
  const counts = {}; CHANGES.forEach(c => counts[c.type] = (counts[c.type] || 0) + 1);
  return `<section class="card edge-amber">${crumbs("<span>타임라인</span>")}
      <h2 class="page-title">타임라인</h2>
      <p class="lede">문서가 추가되고 고쳐진 기록을 날짜순으로 모았다. 정기 업데이트는 2주마다 월요일 오전에 반영된다.</p>
      <div class="tl-next">다음 정기 업데이트 예정 <span class="mono">${fmtDate(nextUpdate())}</span> (월)</div>
      <div class="chipline" id="tlFilter" style="margin-top:14px">
        <button class="chip" data-t="all" aria-pressed="${filt === "all"}">전체 <span class="n">${CHANGES.length}</span></button>
        ${Object.keys(TYPES).filter(k => counts[k]).map(k => `<button class="chip" data-t="${k}" aria-pressed="${filt === k}">${TYPES[k]} <span class="n">${counts[k]}</span></button>`).join("")}
      </div></section>
    <ol class="timeline">${days.map(d => {
      const items = CHANGES.filter(c => c.date === d && (filt === "all" || c.type === filt));
      const r = releaseOf(d);
      if (!items.length && !r) return "";
      const byCat = new Map();
      items.forEach(c => { const t = byId.get(c.id); const cat = t ? topicById.get(t.topic)?.cat : "_"; if (!byCat.has(cat)) byCat.set(cat, []); byCat.get(cat).push(c); });
      const big = items.length > 40;
      return `<li class="tl-day"><div class="card">
        <div class="tl-head"><div class="tl-date">${fmtDate(d)}<small>${weekdayOf(d)}요일</small></div><div class="tl-counts">${typeSummary(items)}</div></div>
        ${r ? `<h3 class="tl-title">${esc(r.title)}</h3><p class="tl-note">${esc(r.note)}</p>` : ""}
        <div class="tl-body" ${big ? "hidden" : ""}>${[...byCat.entries()].map(([cat, list]) => `<div class="tl-group"><h5>${catPill(cat)} <span style="color:var(--muted);font-weight:400">${list.length}</span></h5>
          <ul class="tl-items">${list.map(c => `<li>${termLink(c.id)}${c.type !== "added" || c.summary !== "최초 수록" ? `<i>${esc(c.summary)}</i>` : ""}</li>`).join("")}</ul></div>`).join("")}</div>
        ${big ? `<button class="more" data-more>문서 ${items.length}개 펼치기</button>` : ""}
      </div></li>`;
    }).join("")}</ol>`;
}

/* ---------- 화면: 색인 ---------- */
function viewIndex() {
  syncTree();
  const byEn = state.ixSort === "en";
  const list = LIVE.filter(t => !state.levels.size || state.levels.has(t.level))
    .sort((a, b) => byEn ? a.en.localeCompare(b.en, "en", { sensitivity: "base" }) : koCmp.compare(a.ko, b.ko));
  const groups = new Map();
  list.forEach(t => { const k = byEn ? choOf(t.en) : choOf(t.ko); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  const keys = [...groups.keys()].sort((a, b) => {
    const ia = byEn ? -1 : KO_INDEX.indexOf(a), ib = byEn ? -1 : KO_INDEX.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    if (a === "#") return -1; if (b === "#") return 1; return a.localeCompare(b);
  });
  const lv = { 1: 0, 2: 0, 3: 0 }; LIVE.forEach(t => lv[t.level]++);
  return `<section class="card edge-amber">${crumbs("<span>색인</span>")}
      <h2 class="page-title">색인</h2><div class="page-sub">${list.length} / ${LIVE.length}개 문서</div>
      <div class="toolrow">
        <div class="chipline" id="lvChips">${[1,2,3].map(l => `<button class="chip" data-l="${l}" aria-pressed="${state.levels.has(l)}">${LEVELS[l]} <span class="n">${lv[l]}</span></button>`).join("")}</div>
        <label for="ixSort">정렬 <select id="ixSort"><option value="ko" ${!byEn ? "selected" : ""}>가나다순</option><option value="en" ${byEn ? "selected" : ""}>ABC순</option></select></label>
      </div></section>
    <div class="ix">${keys.map(k => `<section class="card tight ix-group"><h2>${esc(k)}</h2>${groups.get(k).map(t => `<a href="#${t.id}" data-go="${t.id}"><span class="k">${esc(byEn ? t.en : t.ko)}</span><span class="e">${esc(byEn ? t.ko : (t.abbr || t.en))}</span></a>`).join("")}</section>`).join("") || '<div class="card empty"><strong>맞는 문서가 없다</strong>난이도 필터를 해제해 보자.</div>'}</div>`;
}

/* ---------- 화면: 검색 결과 ---------- */
function matches(t, q) {
  if (/^[ㄱ-ㅎ]+$/.test(q)) return t._ini.includes(q);
  return t._hay.includes(q);
}
function score(t, q) {
  if (/^[ㄱ-ㅎ]+$/.test(q)) return t._ini.startsWith(q) ? 2 : 1;
  if ([t.ko, t.abbr, t.en].some(v => v && v.toLowerCase() === q)) return 4;
  if (t._name.startsWith(q)) return 3;
  if (t._name.includes(q)) return 2;
  return 1;
}
function searchResults() {
  const q = state.q.trim().toLowerCase();
  return LIVE.filter(t => matches(t, q)).sort((a, b) => score(b, q) - score(a, q) || koCmp.compare(a.ko, b.ko));
}
function viewSearch() {
  const q = state.q.trim(), list = searchResults();
  const hq = /^[ㄱ-ㅎ]+$/.test(q) ? "" : q;
  return `<section class="card edge-amber"><h2 class="page-title">“${esc(q)}” 검색 결과</h2><div class="page-sub">${list.length}개 문서 · Enter를 누르면 첫 문서로 이동</div></section>
    ${list.length ? `<section class="grid g2">${list.slice(0, 60).map(t => termCard(t, { hq, text: t.easy })).join("")}</section>`
      : `<section class="card empty"><strong>맞는 문서가 없다</strong>검색어를 줄여 보자. 초성(예: ㅍㅇㅌㄴ → 파인튜닝)으로도 찾을 수 있다.</section>`}`;
}

/* ---------- 조회 집계 · 인기 순위 ---------- */
const statsOn = !!(STATS.url && STATS.key);
const sbUrl = p => STATS.url.replace(/\/+$/, "") + "/rest/v1/" + p;
const sbHeaders = () => Object.assign({ apikey: STATS.key, "Content-Type": "application/json" }, STATS.key.startsWith("eyJ") ? { Authorization: "Bearer " + STATS.key } : {});
let ranking = [], rankState = "loading";
const seenNow = new Set();
async function loadRanking() {
  if (!statsOn) return;
  $("#navRank").hidden = false;
  try {
    const r = await fetch(sbUrl("term_hits?select=term_id,hits&hits=gt.0&order=hits.desc&limit=50"), { headers: sbHeaders() });
    if (!r.ok) throw new Error(r.status);
    ranking = (await r.json()).filter(x => byId.has(x.term_id) && byId.get(x.term_id).status !== "removed");
    rankState = "ok";
  } catch (e) { rankState = "error"; }
  renderPopular();
  if (state.route === "rank") render();
}
function renderPopular() {
  const top = ranking.slice(0, 6);
  $("#popular").hidden = !top.length;
  $("#popChips").innerHTML = top.map((r, i) => `<a class="chip pop" href="#${r.term_id}" data-go="${r.term_id}"><b>${i + 1}</b>${esc(byId.get(r.term_id).ko)}</a>`).join("");
}
function viewRank() {
  syncTree();
  const head = `<section class="card edge-amber">${crumbs("<span>인기 순위</span>")}<h2 class="page-title">인기 순위</h2>
    <p class="rank-note">방문자가 열어 본 문서를 집계한 누적 순위다. 같은 사람이 한 번 방문하는 동안 같은 문서를 여러 번 봐도 1회로 센다.</p></section>`;
  const box = inner => head + `<section class="card">${inner}</section>`;
  if (!statsOn) return box(`<div class="empty"><strong>이 화면에서는 순위를 볼 수 없다</strong>공개 사이트에서 제공한다.</div>`);
  if (rankState === "loading") return box(`<div class="empty">순위를 불러오는 중…</div>`);
  if (rankState === "error") return box(`<div class="empty"><strong>순위를 불러오지 못했다</strong>잠시 후 새로고침해 보자.</div>`);
  if (!ranking.length) return box(`<div class="empty"><strong>아직 집계된 조회가 없다</strong>문서를 열어 보면 여기에 순위가 쌓인다.</div>`);
  const max = ranking[0].hits;
  return box(`<ol class="rank">${ranking.slice(0, 30).map((r, i) => { const t = byId.get(r.term_id), tp = topicById.get(t.topic);
    return `<li><span class="no">${i + 1}</span><span class="t"><a href="#${t.id}" data-go="${t.id}">${esc(t.ko)}</a><small>${esc(t.abbr || t.en)} · ${esc(catById.get(tp.cat).ko)}</small></span>
      <span class="v"><span class="bar"><i style="width:${Math.max(4, Math.round(r.hits / max * 100))}%"></i></span><span class="hits">${r.hits.toLocaleString("ko-KR")}회</span></span></li>`; }).join("")}</ol>`);
}
function track(id) {
  if (!statsOn || !byId.has(id) || seenNow.has(id)) return;
  let seen = []; try { seen = JSON.parse(sessionStorage.getItem("gl-seen") || "[]"); } catch (e) {}
  seenNow.add(id); if (seen.includes(id)) return;
  try { sessionStorage.setItem("gl-seen", JSON.stringify(seen.concat(id))); } catch (e) {}
  fetch(sbUrl("rpc/increment_hit"), { method: "POST", headers: sbHeaders(), body: JSON.stringify({ p_term: id }), keepalive: true })
    .then(r => { if (!r.ok) return; const row = ranking.find(x => x.term_id === id); row ? row.hits++ : ranking.push({ term_id: id, hits: 1 }); ranking.sort((a, b) => b.hits - a.hits); renderPopular(); })
    .catch(() => {});
}

/* ---------- 라우팅 ---------- */
function render() {
  const r = state.route, main = $("#main");
  let html;
  document.querySelectorAll(".nav a").forEach(a => a.removeAttribute("aria-current"));
  if (state.q.trim()) html = viewSearch();
  else if (r === "timeline") html = viewTimeline();
  else if (r === "index") html = viewIndex();
  else if (r === "rank") html = viewRank();
  else if (r.startsWith("c-") && catById.has(r.slice(2))) html = viewCategory(catById.get(r.slice(2)));
  else if (r.startsWith("t-") && topicById.has(r.slice(2))) html = viewTopic(topicById.get(r.slice(2)));
  else if (byId.has(r) && byId.get(r).status !== "removed") html = viewTerm(byId.get(r));
  else { state.route = "home"; html = viewHome(); syncTree(); }
  if (!state.q.trim()) { const cur = document.querySelector(`.nav a[data-go="${state.route}"]`); if (cur) cur.setAttribute("aria-current", "page"); }
  main.innerHTML = html;
  const title = main.querySelector(".page-title");
  document.title = (state.route === "home" && !state.q ? "" : (title ? title.textContent.replace(/[“”]/g, "") + " · " : "")) + "실무 AI 용어집";
}
function go(route, push = true) {
  state.route = route || "home";
  if (state.q) { state.q = ""; $("#q").value = ""; }
  render();
  if (push) { try { history.pushState(null, "", "#" + state.route); } catch (e) {} }
  window.scrollTo({ top: 0 });
  if (matchMedia("(max-width: 860px)").matches) $("#treeBox").open = false;
}
addEventListener("popstate", () => { const h = decodeURIComponent(location.hash.slice(1)); state.route = h || "home"; state.q = ""; $("#q").value = ""; render(); });

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if (a) { e.preventDefault(); go(a.dataset.go); return; }
  const more = e.target.closest("[data-more]");
  if (more) { const body = more.parentElement.querySelector(".tl-body"); body.hidden = !body.hidden; more.textContent = body.hidden ? more.textContent.replace("접기", "펼치기") : more.textContent.replace("펼치기", "접기"); return; }
  const tl = e.target.closest("#tlFilter [data-t]");
  if (tl) { state.tlType = tl.dataset.t; render(); return; }
  const lv = e.target.closest("#lvChips [data-l]");
  if (lv) { const l = +lv.dataset.l; state.levels.has(l) ? state.levels.delete(l) : state.levels.add(l); render(); return; }
});
document.addEventListener("change", e => { if (e.target.id === "ixSort") { state.ixSort = e.target.value; store.set("gl-ixsort", state.ixSort); render(); } });
$("#view").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.v; store.set("gl-view", state.view); syncView(); render(); });
function syncView() { document.querySelectorAll("#view button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.view)); }
let timer, trackTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(timer); clearTimeout(trackTimer);
  timer = setTimeout(() => { state.q = e.target.value; render(); }, 120);
  trackTimer = setTimeout(() => { const q = e.target.value.trim().toLowerCase(); const t = q.length > 1 && LIVE.find(t => [t.ko, t.en, t.abbr].some(v => v && v.toLowerCase() === q)); if (t) track(t.id); }, 1500);
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); state.q = e.target.value; const top = state.q.trim() && searchResults()[0]; if (top) go(top.id); }
  if (e.key === "Escape") { e.target.value = ""; state.q = ""; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q") && !/input|select|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); } });
const tt = $("#toTop");
addEventListener("scroll", () => { tt.hidden = scrollY < 800; }, { passive: true });
tt.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));

/* ---------- 시작 ---------- */
buildTree(); syncView();
$("#navTl").textContent = ([...new Set(CHANGES.map(c => c.date))].sort().pop() || "").slice(5).replace("-", ".");
$("#navIx").textContent = LIVE.length;
const lastDay = [...new Set(CHANGES.map(c => c.date))].sort().pop() || "";
$("#upd").textContent = `${fmtDate(lastDay)} 갱신 · 문서 ${LIVE.length}개 · 2주마다 업데이트`;
$("#foot").textContent = "입문은 누구나, 실무는 업무에 AI를 적용하는 사람, 심화는 구현자 기준이다.";
if (matchMedia("(max-width: 860px)").matches) $("#treeBox").open = false;
{ const h = decodeURIComponent(location.hash.slice(1)); state.route = h.startsWith("tab-") ? h.slice(4) : (h || "home"); }
render();
loadRanking();
</script>
