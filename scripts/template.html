<title>실무 AI 용어집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="비개발자와 개발자를 함께 위한 실무 AI 용어 위키. 분야·주제별 트리, 입문·심화 설명, 출처와 관련 논문, 날짜별 변경 타임라인.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Single light look by design. Layout: learning cards — pill navigation, indigo hero with search on the home page, filled pastel cards per field, white content cards with large radii */
:root {
  color-scheme: light;
  --page: #f4f6fb;
  --card: #ffffff;
  --ink: #1b1f3b;
  --body: #3b4064;
  --muted: #5b6182;
  --line: #e2e5f0;
  --soft: #eceafd;
  --accent: #3d35b8;
  --accent-ink: #e3e1ff;
  --yellow: #ffd84d;
  --yellow-soft: #fff4c2;
  --night: #1b1f3b;
  --night-2: #2c3160;
  --night-sub: #c9cbe6;
  --easy: #9ff0c3; --mid: #ffd84d; --hard: #ffb3c4;
  --l1-bg: #d4f5dd; --l1: #0f4a23;
  --l2-bg: #fff0b8; --l2: #5c3a05;
  --l3-bg: #ffe0e4; --l3: #6f1124;
  --c-basics-bg: #dbe7ff; --c-basics: #12306e;
  --c-dl-bg: #ece0ff; --c-dl: #43186e;
  --c-llm-bg: #cdf1ea; --c-llm: #0b4a41;
  --c-training-bg: #fff0b8; --c-training: #5c3a05;
  --c-prompt-bg: #ffdcd6; --c-prompt: #7a1d10;
  --c-rag-bg: #d4f5dd; --c-rag: #0f4a23;
  --c-agent-bg: #dfe1ff; --c-agent: #262a7a;
  --c-genai-bg: #ffdcef; --c-genai: #6e1546;
  --c-infra-bg: #e2e6ee; --c-infra: #252d3d;
  --c-safety-bg: #ffe0e4; --c-safety: #6f1124;
  --c-biz-bg: #ffe9c7; --c-biz: #5a3a06;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-sans); font-size: 15px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--page); }
.top .wrap { padding-block: 16px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo i { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-style: normal; font-family: var(--f-display); font-weight: 800; font-size: 15px; }
.logo b { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
.top-search { flex: 1 1 260px; max-width: 420px; position: relative; }
.top-search input { width: 100%; border: 0; background: var(--card); border-radius: 999px; padding: 10px 16px 10px 40px; font-size: 14px; box-shadow: 0 1px 2px rgba(27,31,59,.06); }
.top-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.pills a { padding: 8px 14px; border-radius: 999px; background: var(--card); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
.pills a:hover { background: var(--soft); }
.pills a[aria-current="page"] { background: var(--night); color: #fff; }
.pills a.pdf { background: var(--yellow); color: var(--ink); }
.pills a.pdf span { font-family: var(--f-mono); font-size: 11px; font-weight: 400; opacity: .7; margin-left: 4px; }

/* ---------- hero (home) ---------- */
.hero { background: var(--accent); border-radius: 28px; padding: 40px 40px 34px; color: #fff; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; justify-content: space-between; margin-top: 4px; }
.hero h1 { margin: 0; font-family: var(--f-display); font-size: 40px; line-height: 1.2; font-weight: 800; letter-spacing: -.5px; text-wrap: balance; }
.hero p { margin: 12px 0 0; font-size: 16px; color: var(--accent-ink); }
.hero form { display: flex; gap: 8px; max-width: 580px; margin-top: 18px; }
.hero input { flex: 1; min-width: 0; border: 0; border-radius: 16px; padding: 16px 18px; font-size: 16px; color: var(--ink); }
.hero button { border: 0; border-radius: 16px; padding: 0 22px; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 15px; cursor: pointer; }
.hero .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--accent-ink); align-items: center; }
.hero .quick a { color: #fff; background: rgba(255,255,255,.16); padding: 3px 11px; border-radius: 999px; text-decoration: none; }
.hero .quick a:hover { background: rgba(255,255,255,.28); }
.hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-stats div { background: rgba(255,255,255,.14); border-radius: 18px; padding: 14px 18px; min-width: 100px; }
.hero-stats b { display: block; font-family: var(--f-display); font-size: 30px; font-weight: 800; line-height: 1; }
.hero-stats span { font-size: 12.5px; color: var(--accent-ink); }

/* ---------- common ---------- */
main { padding-block: 16px 64px; display: grid; gap: 18px; }
.card { background: var(--card); border-radius: 22px; padding: 24px; min-width: 0; }
.card.night { background: var(--night); color: #fff; }
.card.yellow { background: var(--yellow-soft); }
.card.tight { padding: 18px 20px; border-radius: 18px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.h2 { font-family: var(--f-display); font-size: 21px; font-weight: 800; margin: 10px 4px 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.h2 small { font-family: var(--f-sans); font-size: 13px; font-weight: 400; color: var(--muted); }
.label { font-size: 12px; font-weight: 800; letter-spacing: .5px; color: var(--muted); margin: 0 0 10px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0 0 10px; }
.crumbs a { color: inherit; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.page-title { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1.2; margin: 0; letter-spacing: -.5px; text-wrap: balance; }
.page-sub { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin-top: 6px; }
.page-sub b { color: var(--ink); font-weight: 500; }
.lede { margin: 12px 0 0; font-size: 15.5px; max-width: 70ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 11px; border-radius: 999px; white-space: nowrap; text-decoration: none; line-height: 1.5; }
.pill.l1 { background: var(--l1-bg); color: var(--l1); }
.pill.l2 { background: var(--l2-bg); color: var(--l2); }
.pill.l3 { background: var(--l3-bg); color: var(--l3); }
.pill.yellow { background: var(--yellow); color: var(--ink); }
.pill.ghost { background: var(--soft); color: var(--accent); }
.pill.added { background: var(--l1-bg); color: var(--l1); }
.pill.updated { background: var(--l2-bg); color: var(--l2); }
.pill.moved { background: var(--soft); color: var(--accent); }
.pill.removed { background: var(--l3-bg); color: var(--l3); }
.c-basics { --cb: var(--c-basics-bg); --cf: var(--c-basics); } .c-dl { --cb: var(--c-dl-bg); --cf: var(--c-dl); }
.c-llm { --cb: var(--c-llm-bg); --cf: var(--c-llm); } .c-training { --cb: var(--c-training-bg); --cf: var(--c-training); }
.c-prompt { --cb: var(--c-prompt-bg); --cf: var(--c-prompt); } .c-rag { --cb: var(--c-rag-bg); --cf: var(--c-rag); }
.c-agent { --cb: var(--c-agent-bg); --cf: var(--c-agent); } .c-genai { --cb: var(--c-genai-bg); --cf: var(--c-genai); }
.c-infra { --cb: var(--c-infra-bg); --cf: var(--c-infra); } .c-safety { --cb: var(--c-safety-bg); --cf: var(--c-safety); }
.c-biz { --cb: var(--c-biz-bg); --cf: var(--c-biz); }
.pill.cat { background: var(--cb); color: var(--cf); }
.fill { background: var(--cb); color: var(--cf); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--soft); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 13px; text-decoration: none; cursor: pointer; }
.chip:hover { background: #dcd8fb; }
.chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--night); color: #fff; }
.chip[aria-pressed="true"] .n { color: var(--night-sub); }
.chip.on-fill { background: rgba(255,255,255,.6); color: inherit; }
.chip.on-fill:hover { background: #fff; }
.chip.cur { background: var(--night); color: #fff; }
.gone { color: var(--muted); text-decoration: line-through; }
mark { background: var(--yellow); color: var(--ink); border-radius: 3px; padding: 0 2px; }
.empty { color: var(--muted); }
.empty strong { display: block; font-family: var(--f-display); font-size: 20px; color: var(--ink); margin-bottom: 6px; }
.go { font-weight: 800; text-decoration: none; font-size: 14px; }

/* term cards */
a.tcard { display: grid; gap: 6px; align-content: start; text-decoration: none; color: var(--ink); transition: transform .15s, box-shadow .15s; }
a.tcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(27,31,59,.08); }
.tcard .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tcard .num { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--accent); }
.tcard .t { font-family: var(--f-display); font-size: 19px; font-weight: 800; line-height: 1.35; }
.tcard .e { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: -2px; }
.tcard p { margin: 4px 0 0; font-size: 14px; color: var(--body); }

/* home */
.today h2 { margin: 10px 0 0; font-family: var(--f-display); font-size: 28px; font-weight: 800; line-height: 1.25; }
.today h2 a { color: var(--ink); text-decoration: none; }
.today .e { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.today p { margin: 10px 0 0; font-size: 16px; }
.today .go { display: inline-block; margin-top: 14px; padding: 10px 16px; border-radius: 12px; background: var(--soft); }
.path .k { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--yellow); }
.path h2 { margin: 8px 0 14px; font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.path .lv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.path .lv div { background: var(--night-2); border-radius: 16px; padding: 14px; }
.path .lv b { display: block; font-family: var(--f-display); font-size: 28px; font-weight: 800; line-height: 1.1; }
.path .lv span { font-size: 13px; color: var(--night-sub); }
.path .recent { margin-top: 14px; font-size: 13.5px; color: var(--night-sub); }
.path .recent a { color: #fff; }
a.catcard { border-radius: 22px; padding: 20px; min-height: 172px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; transition: transform .15s; }
a.catcard:hover { transform: translateY(-2px); }
a.catcard .n { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
a.catcard .k { font-size: 17px; font-weight: 800; margin-top: 6px; }
a.catcard .s { font-size: 12.5px; line-height: 1.6; opacity: .82; }
a.catcard.more { background: var(--card); border: 2px dashed #c9cbe6; color: var(--ink); justify-content: center; }

/* tree page & category */
.tree-cat { border-radius: 24px; padding: 24px; }
.tree-cat h3 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 800; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tree-cat h3 a { color: inherit; text-decoration: none; }
.tree-cat h3 a:hover { text-decoration: underline; }
.tree-cat .d { margin: 6px 0 14px; font-size: 14px; opacity: .85; max-width: 80ch; }
.tree-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.tree-topic { background: rgba(255,255,255,.62); border-radius: 16px; padding: 14px 16px; }
.tree-topic h4 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.tree-topic h4 a { color: inherit; text-decoration: none; }
.tree-topic h4 a:hover { text-decoration: underline; }
.tree-topic h4 small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; opacity: .7; }
.tree-topic .chip { background: rgba(255,255,255,.85); color: var(--ink); font-size: 12.5px; padding: 3px 10px; }
.tree-topic .chip:hover { background: #fff; }
.topicnum { font-family: var(--f-mono); font-size: 12px; font-weight: 500; opacity: .7; }

/* term page */
.doc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start; }
.seg { display: inline-grid; grid-template-columns: repeat(3, auto); background: var(--soft); border-radius: 999px; padding: 3px; margin-top: 14px; }
.seg button { border: 0; background: none; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--night); color: #fff; }
.def .tagline { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.def p { margin: 0; font-size: 16.5px; line-height: 1.8; }
.def.night p { color: #eef0ff; }
.def.night .tagline .pill { background: var(--hard); color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.src a { font-weight: 600; text-decoration: none; color: var(--ink); }
.src a:hover { color: var(--accent); text-decoration: underline; }
.src .m { display: flex; gap: 6px; align-items: center; margin-top: 2px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.src .typ { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--accent); }
.src .typ.official { background: var(--l1-bg); color: var(--l1); }
.src .typ.docs { background: var(--c-basics-bg); color: var(--c-basics); }
.src .typ.encyclopedia { background: var(--c-infra-bg); color: var(--c-infra); }
.ext { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.ext a { font-size: 12.5px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--night); color: #fff; text-decoration: none; }
.ext a:hover { background: var(--accent); }
.seq { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.seq a { text-decoration: none; color: var(--ink); font-weight: 700; display: grid; gap: 2px; }
.seq a small { color: var(--muted); font-size: 12px; font-weight: 400; }
.seq a.next { text-align: right; grid-column: 2; }
.more-links summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 700; margin-top: 10px; }
.more-links .chips { margin-top: 8px; }
.hist li { display: grid; grid-template-columns: 92px auto minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.hist .d { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }

/* papers */
.paper a.ttl { font-family: var(--f-display); font-size: 17px; font-weight: 700; color: var(--ink); text-decoration: none; line-height: 1.4; }
.paper a.ttl:hover { color: var(--accent); text-decoration: underline; }
.paper .m { font-size: 13px; color: var(--muted); margin-top: 4px; }
.paper .orig { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-style: italic; line-height: 1.5; }
.pill.kr { background: #d9f2ff; color: #0b3f5c; }
.pill.intl { background: #ece0ff; color: #43186e; }
.ratio { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin-top: 8px; max-width: 420px; background: var(--soft); }
.ratio i { display: block; height: 100%; }
.ratio-l { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.ratio-l b { color: var(--ink); }
.pgroup + .pgroup { margin-top: 16px; }
.pgroup h4 { margin: 0 0 8px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.paper .m b { color: var(--ink); font-weight: 600; }
.paper .chips { margin-top: 10px; }
.paper-search { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.paper-search input { flex: 1 1 280px; min-width: 0; border: 0; background: var(--soft); border-radius: 14px; padding: 12px 16px; font-size: 15px; }
.toolrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 14px; }
.toolrow label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.toolrow select { border: 0; background: var(--soft); border-radius: 999px; padding: 6px 12px; font-size: 13px; }

/* timeline */
.tl { display: grid; gap: 14px; }
.tl-day { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 18px; align-items: start; }
.tl-when { position: sticky; top: 80px; }
.tl-when b { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 800; line-height: 1.1; }
.tl-when span { font-size: 13px; color: var(--muted); }
.tl-title { margin: 0; font-family: var(--f-display); font-size: 21px; font-weight: 800; }
.tl-note { margin: 6px 0 0; color: var(--body); font-size: 14.5px; max-width: 72ch; }
.tl-counts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.tl-group { margin-top: 16px; }
.tl-group h5 { margin: 0 0 8px; }
.tl-items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tl-items a, .tl-items .gone { display: inline-block; font-size: 13px; padding: 4px 11px; border-radius: 999px; background: var(--soft); color: var(--ink); text-decoration: none; }
.tl-items a:hover { background: #dcd8fb; }
.tl-items i { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 4px; }
.more { margin-top: 14px; border: 0; background: var(--night); color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }

/* index */
.ix { columns: 4 230px; column-gap: 16px; }
.ix-group { break-inside: avoid; margin-bottom: 16px; display: block; }
.ix-group h2 { margin: 0 0 8px; font-family: var(--f-display); font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1; }
.ix-group a { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 14px; }
.ix-group a:hover .k { color: var(--accent); text-decoration: underline; }
.ix-group .e { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48%; }

/* rank */
.rank { list-style: none; margin: 0; padding: 0; display: grid; }
.rank li { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(90px, 200px); gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rank li:first-child { border-top: 0; }
.rank .no { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--muted); text-align: right; }

<script>
const TERMS = /*__DATA__*/[];
const TREE = /*__TREE__*/[];
const CHANGES = /*__CHANGES__*/[];
const RELEASES = /*__RELEASES__*/[];
/* 조회 순위 집계 설정 — Supabase 프로젝트 URL과 publishable 키. 비워 두면 순위 기능은 숨겨진다. */
const STATS = { url: "", key: "" };

const LEVELS = { 1: "입문", 2: "실무", 3: "심화" };
const TYPES = { added: "추가", updated: "수정", moved: "이동", removed: "삭제" };
const SRC_TYPES = { official: "공식", docs: "문서", guide: "해설", encyclopedia: "백과", article: "기사" };
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const CHO_BASE = { "ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ" };
const KO_INDEX = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const koCmp = new Intl.Collator("ko");

/* ---------- 인덱스 구성 ---------- */
const LIVE = TERMS.filter(t => t.status !== "removed");
const byId = new Map(TERMS.map(t => [t.id, t]));
const catById = new Map(TREE.map(c => [c.id, c]));
const topicById = new Map();
TREE.forEach(c => c.topics.forEach((tp, i) => topicById.set(tp.id, Object.assign(tp, { cat: c.id, idx: i }))));
const backlinks = new Map();
LIVE.forEach(t => (t.related || []).forEach(r => { if (!backlinks.has(r)) backlinks.set(r, []); backlinks.get(r).push(t.id); }));
const histOf = new Map();
CHANGES.forEach(c => { if (!histOf.has(c.id)) histOf.set(c.id, []); histOf.get(c.id).push(c); });
const liveTopicTerms = tp => tp.terms.filter(id => byId.has(id) && byId.get(id).status !== "removed");
/* 논문: 같은 논문(url 기준)을 하나로 묶고 연결된 문서를 모은다 */
const PAPERS = (() => {
  const m = new Map();
  LIVE.forEach(t => (t.papers || []).forEach(p => {
    const k = (p.url || p.title).toLowerCase();
    if (!m.has(k)) m.set(k, Object.assign({}, p, { terms: [], cats: new Set() }));
    const e = m.get(k); if (!e.terms.includes(t.id)) e.terms.push(t.id); e.cats.add(t.cat);
  }));
  return [...m.values()].map(p => Object.assign(p, { _hay: [p.title_ko, p.title, p.authors, p.venue, p.year, p.region === "kr" ? "국내" : "해외", ...p.terms.map(id => byId.get(id).ko + " " + byId.get(id).en)].join(" ").toLowerCase() }))
    .sort((a, b) => (b.year || 0) - (a.year || 0) || a.title.localeCompare(b.title));
})();
const SOURCE_COUNT = LIVE.reduce((s, t) => s + (t.sources || []).length, 0);
const PAPER_KR = PAPERS.filter(p => p.region === "kr").length, PAPER_INTL = PAPERS.length - PAPER_KR;
const regionPill = p => p.region === "kr" ? '<span class="pill kr">국내</span>' : '<span class="pill intl">해외</span>';
/* 논문 제목: 한글 제목을 크게, 원제가 다르면 아래 작게 */
const paperTitle = (p, q) => {
  const ko = p.title_ko || p.title, h = s => q ? hi(s, q) : esc(s);
  return `<a class="ttl" href="${safeUrl(p.url)}" target="_blank" rel="noopener">${h(ko)}</a>${ko !== p.title ? `<div class="orig">${h(p.title)}</div>` : ""}`;
};

function choOf(s) {
  const c = s.trim().charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) { const ch = CHO[Math.floor((c - 0xAC00) / 588)]; return CHO_BASE[ch] || ch; }
  const L = s.trim()[0].toUpperCase();
  return /[A-Z]/.test(L) ? L : "#";
}
function initials(s) { let o = ""; for (const ch of s) { const c = ch.charCodeAt(0); o += (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c - 0xAC00) / 588)] : ch.toLowerCase(); } return o; }
LIVE.forEach(t => {
  t._hay = [t.ko, t.en, t.abbr, t.easy, t.deep, t.example].join(" ").toLowerCase();
  t._name = [t.ko, t.en, t.abbr].join(" ").toLowerCase();
  t._ini = initials(t.ko.replace(/\s/g, ""));
});

const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const state = { route: "home", q: "", view: store.get("gl-view") || "both", levels: new Set(), ixSort: store.get("gl-ixsort") || "ko", tlType: "all", pq: "", pcat: "", pera: "", preg: "" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const fmtDate = d => (d || "").replaceAll("-", ".");
function hi(text, q) {
  const e = esc(text); if (!q) return e;
  const qq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return e.replace(new RegExp(qq, "gi"), m => `<mark>${m}</mark>`);
}
const lvPill = l => `<span class="pill l${l}">${LEVELS[l]}</span>`;
const catPill = (id, label) => `<span class="pill cat c-${id}">${esc(label ?? catById.get(id)?.ko ?? "")}</span>`;
const termLink = id => { const t = byId.get(id); if (!t) return ""; return t.status === "removed" ? `<span class="gone">${esc(t.ko)}</span>` : `<a href="#${id}" data-go="${id}">${esc(t.ko)}</a>`; };
const termChip = (id, cls = "chip") => { const t = byId.get(id); if (!t) return ""; return t.status === "removed" ? `<span class="${cls} gone">${esc(t.ko)}</span>` : `<a class="${cls}" href="#${id}" data-go="${id}">${esc(t.ko)}</a>`; };
const sep = `<span aria-hidden="true">›</span>`;
const crumbs = (...parts) => `<nav class="crumbs"><a href="#home" data-go="home">대문</a>${parts.map(p => sep + p).join("")}</nav>`;
const enOf = t => t.abbr && t.abbr !== t.en ? `${t.abbr} · ${t.en}` : t.en;
const catCount = c => c.topics.reduce((s, tp) => s + liveTopicTerms(tp).length, 0);
function termCard(t, o = {}) {
  const text = o.text ?? (state.view === "deep" ? t.deep : t.easy);
  const h = s => o.hq !== undefined ? hi(s, o.hq) : esc(s);
  return `<a class="card tcard" href="#${t.id}" data-go="${t.id}">
    <div class="top-row">${o.no ? `<span class="num">${o.no}</span>` : catPill(t.cat)}${lvPill(t.level)}</div>
    <div class="t">${h(t.ko)}</div><div class="e">${h(enOf(t))}</div><p>${h(text)}</p></a>`;
}
function weekdayOf(d) { const [y, m, dd] = d.split("-").map(Number); return "일월화수목금토"[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]; }
function nextUpdate() {
  // 기준일 2026-10-19(월)부터 2주 간격의 월요일
  const base = Date.UTC(2026, 9, 19), day = 86400000, now = Date.now() + 9 * 3600000;
  let n = base; while (n + 9 * 3600000 <= now) n += 14 * day;
  const d = new Date(n); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}
const releaseOf = d => RELEASES.find(r => r.date === d);
function typeSummary(list) {
  const n = {}; list.forEach(c => n[c.type] = (n[c.type] || 0) + 1);
  return Object.keys(TYPES).filter(k => n[k]).map(k => `<span class="pill ${k}">${TYPES[k]} ${n[k]}</span>`).join(" ");
}
const extLinks = (q, qk = q) => `<div class="ext">
  <a href="https://arxiv.org/search/?query=${encodeURIComponent(q)}&amp;searchtype=all" target="_blank" rel="noopener">arXiv</a>
  <a href="https://www.semanticscholar.org/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">Semantic Scholar</a>
  <a href="https://scholar.google.com/scholar?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">Google Scholar</a>
  <a href="https://www.riss.kr/search/Search.do?query=${encodeURIComponent(qk)}" target="_blank" rel="noopener">RISS(국내)</a>
  <a href="https://www.dbpia.co.kr/search/topSearch?searchOption=all&amp;query=${encodeURIComponent(qk)}" target="_blank" rel="noopener">DBpia(국내)</a>
  <a href="https://scienceon.kisti.re.kr/srch/selectPORSrchTotal.do?searchKeyword=${encodeURIComponent(qk)}" target="_blank" rel="noopener">ScienceON(국내)</a></div>`;

/* ---------- 대문 ---------- */
function todayTerm() {
  const d = new Date(); const seed = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
  const pool = LIVE.filter(t => t.level <= 2);
  return pool[(seed * 2654435761 >>> 0) % pool.length];
}
function viewHome() {
  const t = todayTerm(), tp = topicById.get(t.topic);
  const days = [...new Set(CHANGES.map(c => c.date))].sort().reverse();
  const last = days[0], r = releaseOf(last);
  const lv = { 1: 0, 2: 0, 3: 0 }; LIVE.forEach(x => lv[x.level]++);
  const pop = ranking.slice(0, 8);
  return `<section class="grid g2">
      <article class="card today">
        <span class="pill yellow">오늘의 용어 · ${LEVELS[t.level]}</span>
        <h2><a href="#${t.id}" data-go="${t.id}">${esc(t.ko)}</a></h2>
        <div class="e">${esc(enOf(t))} · ${esc(catById.get(tp.cat).ko)} › ${esc(tp.ko)}</div>
        <p>${esc(t.easy)}</p>
        <a class="go" href="#${t.id}" data-go="${t.id}">심화 설명까지 읽기 →</a>
      </article>
      <article class="card night path">
        <div class="k">학습 경로</div>
        <h2>입문에서 심화까지, 주제별 읽는 순서</h2>
        <div class="lv"><div><b style="color:var(--easy)">${lv[1]}</b><span>입문 · 누구나</span></div><div><b style="color:var(--mid)">${lv[2]}</b><span>실무 · 업무 적용</span></div><div><b style="color:var(--hard)">${lv[3]}</b><span>심화 · 구현자</span></div></div>
        <div class="recent">최근 바뀜 · ${fmtDate(last)} ${esc(r?.title || "")} · <a href="#timeline" data-go="timeline">타임라인 보기</a></div>
      </article>
    </section>
    ${pop.length ? `<section class="card tight"><p class="label">요즘 많이 찾는 문서</p><div class="chips">${pop.map((p, i) => `<a class="chip" href="#${p.term_id}" data-go="${p.term_id}"><b class="mono" style="color:var(--accent)">${i + 1}</b>${esc(byId.get(p.term_id).ko)}</a>`).join("")}</div></section>` : ""}
    <h2 class="h2">분야 고르기 <small>${TREE.length}개 분야 · ${TREE.reduce((s, c) => s + c.topics.length, 0)}개 주제</small></h2>
    <section class="grid g4">${TREE.map(c => `<a class="catcard fill c-${c.id}" href="#c-${c.id}" data-go="c-${c.id}">
        <span class="n">${catCount(c)}</span><span class="k">${esc(c.ko)}</span><span class="s">${c.topics.map(tp => esc(tp.ko)).join(" · ")}</span></a>`).join("")}
      <a class="catcard more" href="#tree" data-go="tree"><span class="k">위키 트리 전체 보기 →</span><span class="s" style="color:var(--muted);opacity:1">분야 › 주제 › 문서를 한 화면에</span></a>
    </section>`;
}

/* ---------- 트리 ---------- */
function viewTree() {
  return `<section class="card">${crumbs("<span>트리</span>")}<h1 class="page-title">위키 트리</h1>
      <p class="lede">분야 ${TREE.length}개 › 주제 ${TREE.reduce((s, c) => s + c.topics.length, 0)}개 › 문서 ${LIVE.length}개. 주제 안의 문서는 읽는 순서대로 놓여 있다.</p></section>
    ${TREE.map(c => `<section class="tree-cat fill c-${c.id}">
      <h3><a href="#c-${c.id}" data-go="c-${c.id}">${esc(c.ko)}</a><span class="mono" style="font-size:14px;font-weight:500">${catCount(c)}개 문서</span></h3>
      <p class="d">${esc(c.desc)}</p>
      <div class="tree-topics">${c.topics.map((tp, i) => `<div class="tree-topic"><h4><a href="#t-${tp.id}" data-go="t-${tp.id}"><span class="topicnum">${String(i + 1).padStart(2, "0")}</span> ${esc(tp.ko)}</a><small>${liveTopicTerms(tp).length}</small></h4>
        <div class="chips">${liveTopicTerms(tp).map(id => termChip(id)).join("")}</div></div>`).join("")}</div>
    </section>`).join("")}`;
}

/* ---------- 분야 ---------- */
function viewCategory(c) {
  return `<section class="tree-cat fill c-${c.id}">${crumbs(`<a href="#tree" data-go="tree">트리</a>`, "<span>분야</span>")}
      <h1 class="page-title">${esc(c.ko)}</h1><div class="page-sub" style="color:inherit;opacity:.75">${esc(c.en)} · 주제 ${c.topics.length}개 · 문서 ${catCount(c)}개</div>
      <p class="lede">${esc(c.desc)}</p></section>
    <section class="grid g2">${c.topics.map((tp, i) => `<article class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="pill cat c-${c.id}">주제 ${String(i + 1).padStart(2, "0")}</span><span class="mono" style="font-size:12px;color:var(--muted)">${liveTopicTerms(tp).length}개 문서</span></div>
      <h2 style="margin:10px 0 0;font-family:var(--f-display);font-size:21px"><a href="#t-${tp.id}" data-go="t-${tp.id}" style="color:var(--ink);text-decoration:none">${esc(tp.ko)}</a></h2>
      <p style="margin:6px 0 12px;color:var(--body);font-size:14px">${esc(tp.desc)}</p>
      <div class="chips">${liveTopicTerms(tp).map(id => `<a class="chip" href="#${id}" data-go="${id}">${esc(byId.get(id).ko)} <span class="n">${LEVELS[byId.get(id).level]}</span></a>`).join("")}</div>
      <a class="go" href="#t-${tp.id}" data-go="t-${tp.id}" style="display:inline-block;margin-top:14px">순서대로 읽기 →</a></article>`).join("")}</section>`;
}

/* ---------- 주제 ---------- */
function viewTopic(tp) {
  const c = catById.get(tp.cat), ids = liveTopicTerms(tp);
  const prev = c.topics[tp.idx - 1], next = c.topics[tp.idx + 1];
  return `<section class="tree-cat fill c-${c.id}">${crumbs(`<a href="#c-${c.id}" data-go="c-${c.id}">${esc(c.ko)}</a>`, "<span>주제</span>")}
      <h1 class="page-title">${esc(tp.ko)}</h1><div class="page-sub" style="color:inherit;opacity:.75">${esc(tp.en)} · 문서 ${ids.length}개</div>
      <p class="lede">${esc(tp.desc)}</p></section>
    <h2 class="h2">읽는 순서 <small>입문에서 심화로, 앞 개념을 알아야 이해되는 순서다</small></h2>
    <section class="grid g3">${ids.map((id, i) => termCard(byId.get(id), { no: i + 1 })).join("")}</section>
    <nav class="seq">${prev ? `<a class="card tight" href="#t-${prev.id}" data-go="t-${prev.id}"><small>← 이전 주제</small>${esc(prev.ko)}</a>` : ""}${next ? `<a class="card tight next" href="#t-${next.id}" data-go="t-${next.id}"><small>다음 주제 →</small>${esc(next.ko)}</a>` : ""}</nav>`;
}

/* ---------- 문서 ---------- */
function viewTerm(t) {
  const tp = topicById.get(t.topic), c = catById.get(tp.cat);
  track(t.id);
  const ids = liveTopicTerms(tp), i = ids.indexOf(t.id);
  const prev = ids[i - 1], next = ids[i + 1];
  const rel = (t.related || []).filter(id => byId.has(id) && id !== t.id);
  const back = (backlinks.get(t.id) || []).filter(id => id !== t.id && !rel.includes(id));
  const hist = (histOf.get(t.id) || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const showEasy = state.view !== "deep", showDeep = state.view !== "easy";

/* ---------- 논문 ---------- */

function inEra(y, era) {

}

      <p class="label" style="margin:16px 0 0">${state.pq.trim() ? `“${esc(state.pq.trim())}” 학술 검색으로 더 찾기` : "학술 검색 바로가기"}</p>${extLinks(state.pq.trim() || "large language model")}

/* ---------- 색인 ---------- */
function viewIndex() {
  const byEn = state.ixSort === "en";
  const list = LIVE.filter(t => !state.levels.size || state.levels.has(t.level))
    .sort((a, b) => byEn ? a.en.localeCompare(b.en, "en", { sensitivity: "base" }) : koCmp.compare(a.ko, b.ko));
  const groups = new Map();
  list.forEach(t => { const k = byEn ? choOf(t.en) : choOf(t.ko); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  const keys = [...groups.keys()].sort((a, b) => {
    const ia = byEn ? -1 : KO_INDEX.indexOf(a), ib = byEn ? -1 : KO_INDEX.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    if (a === "#") return -1; if (b === "#") return 1; return a.localeCompare(b);
  });
  const lv = { 1: 0, 2: 0, 3: 0 }; LIVE.forEach(t => lv[t.level]++);
  return `<section class="card">${crumbs("<span>색인</span>")}
      <h1 class="page-title">색인</h1><div class="page-sub">${list.length} / ${LIVE.length}개 문서</div>
      <div class="toolrow">
        <div class="chips" id="lvChips">${[1, 2, 3].map(l => `<button class="chip" data-l="${l}" aria-pressed="${state.levels.has(l)}">${LEVELS[l]} <span class="n">${lv[l]}</span></button>`).join("")}</div>
        <label for="ixSort">정렬 <select id="ixSort"><option value="ko" ${!byEn ? "selected" : ""}>가나다순</option><option value="en" ${byEn ? "selected" : ""}>ABC순</option></select></label>
      </div></section>
    <div class="ix">${keys.map(k => `<section class="card tight ix-group"><h2>${esc(k)}</h2>${groups.get(k).map(t => `<a href="#${t.id}" data-go="${t.id}"><span class="k">${esc(byEn ? t.en : t.ko)}</span><span class="e">${esc(byEn ? t.ko : (t.abbr || t.en))}</span></a>`).join("")}</section>`).join("") || '<section class="card empty"><strong>맞는 문서가 없다</strong>난이도 필터를 해제해 보자.</section>'}</div>`;
}

/* ---------- 검색 결과 ---------- */
function matches(t, q) { return /^[ㄱ-ㅎ]+$/.test(q) ? t._ini.includes(q) : t._hay.includes(q); }
function score(t, q) {
  if (/^[ㄱ-ㅎ]+$/.test(q)) return t._ini.startsWith(q) ? 2 : 1;
  if ([t.ko, t.abbr, t.en].some(v => v && v.toLowerCase() === q)) return 4;
  if (t._name.startsWith(q)) return 3;
  if (t._name.includes(q)) return 2;
  return 1;
}
function searchResults() { const q = state.q.trim().toLowerCase(); return LIVE.filter(t => matches(t, q)).sort((a, b) => score(b, q) - score(a, q) || koCmp.compare(a.ko, b.ko)); }
function viewSearch() {
  const q = state.q.trim(), list = searchResults();
  const hq = /^[ㄱ-ㅎ]+$/.test(q) ? "" : q;
  const pl = hq ? PAPERS.filter(p => p._hay.includes(hq.toLowerCase())).slice(0, 4) : [];
  return `<h2 class="h2">“${esc(q)}” 검색 결과 <small>문서 ${list.length}개${pl.length ? ` · 논문 ${pl.length}편` : ""} · Enter를 누르면 첫 문서로</small></h2>
    ${list.length ? `<section class="grid g3">${list.slice(0, 60).map(t => termCard(t, { hq, text: t.easy })).join("")}</section>`
      : `<section class="card empty"><strong>맞는 문서가 없다</strong>검색어를 줄여 보자. 초성(예: ㅍㅇㅌㄴ → 파인튜닝)으로도 찾을 수 있다.</section>`}
    ${pl.length ? `<h2 class="h2">관련 논문 <small><a href="#papers" data-go="papers" data-pq="${esc(hq)}">논문에서 더 보기 →</a></small></h2>
      <section class="grid g2">${pl.map(p => `<article class="card paper"><div style="margin-bottom:6px">${regionPill(p)}</div>${paperTitle(p, hq)}<div class="m"><b>${esc(p.authors || "")}</b> · ${esc(p.year || "")} · ${esc(p.venue || "")}</div></article>`).join("")}</section>` : ""}`;
}

/* ---------- 조회 집계 · 인기 순위 ---------- */
const statsOn = !!(STATS.url && STATS.key);
const sbUrl = p => STATS.url.replace(/\/+$/, "") + "/rest/v1/" + p;
const sbHeaders = () => Object.assign({ apikey: STATS.key, "Content-Type": "application/json" }, STATS.key.startsWith("eyJ") ? { Authorization: "Bearer " + STATS.key } : {});
let ranking = [], rankState = "loading";
const seenNow = new Set();
async function loadRanking() {
  if (!statsOn) return;
  $("#navRank").hidden = false;
  try {
    const r = await fetch(sbUrl("term_hits?select=term_id,hits&hits=gt.0&order=hits.desc&limit=50"), { headers: sbHeaders() });
    if (!r.ok) throw new Error(r.status);
    ranking = (await r.json()).filter(x => byId.has(x.term_id) && byId.get(x.term_id).status !== "removed");
    rankState = "ok";
  } catch (e) { rankState = "error"; }
  if (!state.q.trim() && (state.route === "rank" || state.route === "home")) render();
}
function viewRank() {
  const head = `<section class="card">${crumbs("<span>인기 순위</span>")}<h1 class="page-title">인기 순위</h1>
    <p class="lede">방문자가 열어 본 문서를 집계한 누적 순위다. 같은 사람이 한 번 방문하는 동안 같은 문서를 여러 번 봐도 1회로 센다.</p></section>`;
  const box = inner => head + `<section class="card">${inner}</section>`;
  if (!statsOn) return box(`<div class="empty"><strong>이 화면에서는 순위를 볼 수 없다</strong>공개 사이트에서 제공한다.</div>`);
  if (rankState === "loading") return box(`<div class="empty">순위를 불러오는 중…</div>`);
  if (rankState === "error") return box(`<div class="empty"><strong>순위를 불러오지 못했다</strong>잠시 후 새로고침해 보자.</div>`);
  if (!ranking.length) return box(`<div class="empty"><strong>아직 집계된 조회가 없다</strong>문서를 열어 보면 여기에 순위가 쌓인다.</div>`);
  const max = ranking[0].hits;
  return box(`<ol class="rank">${ranking.slice(0, 30).map((r, i) => { const t = byId.get(r.term_id);
    return `<li><span class="no">${i + 1}</span><span class="t"><a href="#${t.id}" data-go="${t.id}">${esc(t.ko)}</a><small>${esc(t.abbr || t.en)} · ${esc(catById.get(t.cat).ko)}</small></span>
      <span><span class="bar"><i style="width:${Math.max(4, Math.round(r.hits / max * 100))}%"></i></span><span class="hits" style="display:block">${r.hits.toLocaleString("ko-KR")}회</span></span></li>`; }).join("")}</ol>`);
}
function track(id) {
  if (!statsOn || !byId.has(id) || seenNow.has(id)) return;
  let seen = []; try { seen = JSON.parse(sessionStorage.getItem("gl-seen") || "[]"); } catch (e) {}
  seenNow.add(id); if (seen.includes(id)) return;
  try { sessionStorage.setItem("gl-seen", JSON.stringify(seen.concat(id))); } catch (e) {}
  fetch(sbUrl("rpc/increment_hit"), { method: "POST", headers: sbHeaders(), body: JSON.stringify({ p_term: id }), keepalive: true })
    .then(r => { if (!r.ok) return; const row = ranking.find(x => x.term_id === id); row ? row.hits++ : ranking.push({ term_id: id, hits: 1 }); ranking.sort((a, b) => b.hits - a.hits); })
    .catch(() => {});
}

/* ---------- 라우팅 ---------- */
function render() {
  const r = state.route, searching = !!state.q.trim();
  let html;
  if (searching) html = viewSearch();
  else if (r === "tree") html = viewTree();
  else if (r === "timeline") html = viewTimeline();
  else if (r === "index") html = viewIndex();
  else if (r === "papers") html = viewPapers();
  else if (r === "rank") html = viewRank();
  else if (r.startsWith("c-") && catById.has(r.slice(2))) html = viewCategory(catById.get(r.slice(2)));
  else if (r.startsWith("t-") && topicById.has(r.slice(2))) html = viewTopic(topicById.get(r.slice(2)));
  else if (byId.has(r) && byId.get(r).status !== "removed") html = viewTerm(byId.get(r));
  else { state.route = "home"; html = viewHome(); }
  const home = state.route === "home";
  $("#hero").hidden = !home;
  $("#topSearch").hidden = home;
  document.querySelectorAll(".pills a[data-go]").forEach(a => {
    if (!searching && a.dataset.go === state.route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  $("#main").innerHTML = html;
  const title = $("#main .page-title");
  document.title = (home || !title ? "" : title.textContent + " · ") + "실무 AI 용어집";
}
function setQuery(v) { state.q = v; $("#q").value = v; $("#q2").value = v; }
function go(route, push = true) {
  state.route = route || "home";
  if (state.q) setQuery("");
  render();
  if (push) { try { history.pushState(null, "", "#" + state.route); } catch (e) {} }
  window.scrollTo({ top: 0 });
}
addEventListener("popstate", () => { const h = decodeURIComponent(location.hash.slice(1)); state.route = h || "home"; setQuery(""); render(); });

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if (a) { e.preventDefault(); if (a.dataset.pq !== undefined) state.pq = a.dataset.pq; go(a.dataset.go); return; }
  const qa = e.target.closest("[data-quick]");
  if (qa) { e.preventDefault(); setQuery(qa.dataset.quick); render(); return; }
  const more = e.target.closest("[data-more]");
  if (more) { const body = more.parentElement.querySelector(".tl-body"); body.hidden = !body.hidden; more.textContent = body.hidden ? more.textContent.replace("접기", "펼치기") : more.textContent.replace("펼치기", "접기"); return; }
  const tl = e.target.closest("#tlFilter [data-t]");
  if (tl) { state.tlType = tl.dataset.t; render(); return; }
  const lv = e.target.closest("#lvChips [data-l]");
  if (lv) { const l = +lv.dataset.l; state.levels.has(l) ? state.levels.delete(l) : state.levels.add(l); render(); return; }
  const reg = e.target.closest("#regChips [data-reg]");
  if (reg) { state.preg = reg.dataset.reg; render(); return; }
  const era = e.target.closest("#eraChips [data-era]");
  if (era) { state.pera = era.dataset.era; render(); return; }
  const vb = e.target.closest("#view button");
  if (vb) { state.view = vb.dataset.v; store.set("gl-view", state.view); render(); return; }
});
document.addEventListener("change", e => {
  if (e.target.id === "ixSort") { state.ixSort = e.target.value; store.set("gl-ixsort", state.ixSort); render(); }
  if (e.target.id === "pcat") { state.pcat = e.target.value; render(); }
});
let ptimer;
document.addEventListener("input", e => {
  if (e.target.id !== "pq") return;
  clearTimeout(ptimer);
  ptimer = setTimeout(() => {
    state.pq = e.target.value; const pos = e.target.selectionStart; render();
    const el = $("#pq"); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
  }, 200);
});
document.addEventListener("submit", e => { if (e.target.id === "paperForm") e.preventDefault(); });
let timer, trackTimer;
function onSearchInput(e) {
  const v = e.target.value, other = e.target.id === "q" ? $("#q2") : $("#q");
  other.value = v;
  clearTimeout(timer); clearTimeout(trackTimer);
  timer = setTimeout(() => { state.q = v; render(); }, 120);
  trackTimer = setTimeout(() => { const q = v.trim().toLowerCase(); const t = q.length > 1 && LIVE.find(t => [t.ko, t.en, t.abbr].some(x => x && x.toLowerCase() === q)); if (t) track(t.id); }, 1500);
}
function onSearchKey(e) {
  if (e.key === "Enter") { e.preventDefault(); state.q = e.target.value; const top = state.q.trim() && searchResults()[0]; if (top) go(top.id); }
  if (e.key === "Escape") { setQuery(""); render(); }
}
["#q", "#q2"].forEach(s => { $(s).addEventListener("input", onSearchInput); $(s).addEventListener("keydown", onSearchKey); });
$("#heroForm").addEventListener("submit", e => { e.preventDefault(); const top = state.q.trim() && searchResults()[0]; if (top) go(top.id); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/input|select|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); (state.route === "home" ? $("#q2") : $("#q")).focus(); }
});
const tt = $("#toTop");
addEventListener("scroll", () => { tt.hidden = scrollY < 800; }, { passive: true });
tt.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));

/* ---------- 시작 ---------- */

  const lastDay = [...new Set(CHANGES.map(c => c.date))].sort().pop() || "";
  $("#heroSub").textContent = `${LIVE.length}개 용어를 입문과 심화 두 수준으로. 출처 ${SOURCE_COUNT}건, 국내·해외 논문 ${PAPERS.length}편을 함께 달았다.`;
  $("#heroStats").innerHTML = `<div><b>${LIVE.length}</b><span>문서</span></div><div><b>${PAPERS.length}</b><span>논문</span></div><div><b>${fmtDate(nextUpdate()).slice(5)}</b><span>다음 업데이트</span></div>`;
  $("#quick").innerHTML = `자주 찾는 말 ${["RAG", "파인튜닝", "AI 에이전트", "MCP", "환각", "프롬프트 엔지니어링"].map(w => `<a href="#" data-quick="${esc(w)}">${esc(w)}</a>`).join("")}`;
  $("#foot").textContent = `${fmtDate(lastDay)} 갱신 · 문서 ${LIVE.length}개 · 출처 ${SOURCE_COUNT}건 · 논문 ${PAPERS.length}편 · 2주마다 업데이트`;
  const h = decodeURIComponent(location.hash.slice(1));
  state.route = h.startsWith("tab-") ? h.slice(4) : (h || "home");
  render();
  loadRanking();
}
</script>
